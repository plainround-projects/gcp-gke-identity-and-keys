<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">One request, and the key that refuses it</title>
<desc id="d">A numbered run of one gcloud storage cp across five lanes: Pod files, Identity pool, Bucket, Bucket policy and CMEK key. The pod gets a token from the metadata server (1), sends the request with it (2), IAM checks the principal for roles/storage.objectUser (3), and Cloud Storage uses the key through its service agent (4). Amber rows: with key version 1 disabled the key refuses (4x) and the pod sees a 403 that names the key, not its own principal (5x). Step 5 is the audit entry for the call, which ends the run.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="699" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="698" rx="16"/>
<text class="title" x="48" y="68">One request, and the key that refuses it</text>
<text class="caption" x="48" y="100">One copy from the pod to the bucket. Amber rows: the key version is disabled and the 403 names the key.</text>
<rect class="actor" x="385" y="128" width="150" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Pod files</text>
<rect class="svc" x="550" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="610" y="148" text-anchor="middle">Identity</text>
<text class="lane" x="610" y="168" text-anchor="middle">pool</text>
<rect class="svc" x="710" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">Bucket</text>
<rect class="svc" x="860" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="930" y="148" text-anchor="middle">Bucket</text>
<text class="lane" x="930" y="168" text-anchor="middle">policy</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="158" text-anchor="middle">CMEK key</text>
<path class="hair" d="M460 176V560M610 176V232M770 176V616M930 176V360M1088 176V488"/>
<path class="hair" d="M66 216V600"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Pod gets a token</text>
<text class="sub" x="96" y="232">metadata server, no key file</text>
<path class="sync" d="M460 216H610"/>
<text class="label t-accent" x="476" y="206">get token</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Request carries the token</text>
<text class="sub" x="96" y="296">gcloud storage cp to the bucket</text>
<path class="sync" d="M460 280H770"/>
<text class="label t-accent" x="626" y="270">read, write</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">IAM checks the principal</text>
<text class="sub" x="96" y="360">objectUser on the bucket</text>
<path class="sync" d="M770 344H930"/>
<text class="label t-accent" x="786" y="334">principal</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Storage uses the key</text>
<text class="sub" x="96" y="424">its service agent, not the pod</text>
<path class="sync" d="M770 408H1088"/>
<text class="label t-accent" x="946" y="398">encrypt</text>
<circle class="dot-w" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">4x</text>
<text class="label b t-warn" x="96" y="468">Key version disabled</text>
<text class="sub" x="96" y="488">scripts/break-key.sh</text>
<path class="fail" d="M1088 472H770"/>
<path class="stop" d="M1060 460V484"/>
<text class="label t-warn" x="940" y="462">key disabled</text>
<circle class="dot-w" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="532">Pod sees a 403</text>
<text class="sub" x="96" y="552">names the key, not the pod</text>
<path class="fail" d="M770 536H460"/>
<text class="label t-warn" x="500" y="526">403 names the key</text>
<circle class="dot-g" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="596">Audit log records the call</text>
<text class="sub" x="96" y="616">principal, permission, code 7</text>
<rect class="slot" x="764" y="582" width="12" height="36" rx="4"/>
<path class="ok" d="M776 600H900"/>
<text class="label t-accent" x="786" y="590">audit entry</text>
<rect class="win" x="900" y="580" width="252" height="40" rx="10"/>
<text class="label b t-good" x="916" y="605">every call is logged</text>
<path class="sync" d="M48 656H112"/><text class="legend" x="124" y="661">sync call</text>
<path class="fail" d="M696 656H760"/><text class="legend" x="772" y="661">failure path</text>
<path class="ok" d="M928 656H992"/><text class="legend" x="1004" y="661">result</text>
</svg>
