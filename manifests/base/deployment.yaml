apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  namespace: demo
  labels:
    app: files
    app.kubernetes.io/part-of: gke-identity-and-keys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: files
  template:
    metadata:
      labels:
        app: files
    spec:
      serviceAccountName: reader-writer # the overlay wrong-identity deploys a copy without this line
      automountServiceAccountToken: false # credentials come from the metadata server, not a mounted token
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:590.0.1-slim@sha256:2a5368c4f3e25f7e202ccbd7b63e4128380d8fd683266f7f015c5d0afcc8f3be
          imagePullPolicy: Always
          livenessProbe:
            exec:
              command: ["true"]
          readinessProbe:
            exec:
              command: ["true"]
          command: ["sleep", "infinity"]
          env:
            - name: HOME
              value: /tmp
            - name: CLOUDSDK_CONFIG
              value: /tmp/gcloud
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
