# The Kubernetes service account whose principal gets the bucket role. No annotation, no key: Workload Identity
# Federation for GKE identifies the pod by this name and its namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader-writer
  namespace: demo
  labels:
    app.kubernetes.io/part-of: gke-identity-and-keys
automountServiceAccountToken: false
