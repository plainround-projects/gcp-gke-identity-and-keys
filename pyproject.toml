[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-gke-identity-and-keys"
version = "0.1.0"
description = "Keyless GKE pods, a customer-managed key and a triage tool for the three ways access to a bucket fails."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "pyyaml>=6",
    "types-PyYAML",
    "kubernetes-validate>=1.30",
]

[project.scripts]
gke-triage = "gke_triage.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "S", "D100", "D101", "D103", "D104"]
# Named errors such as InvalidPrincipal read as the condition they report; the suffix would only lengthen them.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["kubernetes_validate", "kubernetes_validate.*"]
ignore_missing_imports = true

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: runs the command-line program as a subprocess against the fixtures",
]

[tool.coverage.run]
source = ["gke_triage"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "gke_triage"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "gke_triage.interfaces",
    "gke_triage.infrastructure",
    "gke_triage.application",
    "gke_triage.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application read no files and print nothing"
type = "forbidden"
source_modules = ["gke_triage.domain", "gke_triage.application"]
forbidden_modules = ["pathlib", "json", "argparse", "subprocess"]
